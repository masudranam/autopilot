name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm's interactive reporter hangs on a non-TTY stdout. CI=1 is set by Actions
  # already, but the explicit reporter flag is what actually makes it safe.
  PNPM_FLAGS: --reporter=append-only

jobs:
  gate:
    name: Verify gate
    runs-on: ubuntu-latest
    # F6/AC5: "the pipeline is under 10 minutes". This is the enforcement — a drift
    # past the budget fails the build rather than quietly becoming the new normal.
    # Baseline at the time of writing: ~107s.
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_dev_password
          POSTGRES_DB: ecommerce_test
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ["6389:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce_dev_password@localhost:5442/ecommerce_test?schema=public
      REDIS_URL: redis://localhost:6389
      # The mock payment provider means the full checkout suite runs with no secrets.
      PAYMENT_PROVIDER: mock
      JWT_ACCESS_SECRET: ci_access_secret_not_used_outside_ci
      JWT_REFRESH_SECRET: ci_refresh_secret_not_used_outside_ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      # F6/AC5. Turbo's local cache lives in .turbo and is per-checkout, so without
      # this every run recomputed every task from scratch — the "cache is restored
      # between runs" half of the criterion was simply not implemented.
      #
      # Keyed on the commit so a re-run of the same SHA is an exact hit; restore-keys
      # fall back to any earlier cache on this branch, then main, so a normal PR push
      # reuses whatever is still valid. Turbo decides validity by content hash, so a
      # stale restore cannot produce a wrong result — only a miss.
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile $PNPM_FLAGS

      # Must run in CI, not only inside `pnpm verify`. A workspace package with no
      # lint/typecheck/test script is skipped silently by Turbo — "Running lint in 4
      # packages" then "1 successful, 1 total" is not an error. That is how this gate
      # was vacuous before F1, and without this step the hole is still open at the
      # only place enforcement is machine-checked rather than self-reported.
      - name: Repo invariants (compose parser, workspace scripts, .env cascade, infra shape)
        run: pnpm check:repo

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # F6/AC5's second half. The job's timeout-minutes is the enforcement — this step
      # only surfaces the number so a slow drift is visible in the log before it starts
      # failing builds.
      - name: Report gate duration
        if: always()
        run: |
          echo "Gate finished. Job timeout is 10 minutes (F6/AC5)."
          echo "Turbo summary for the cacheable tasks:"
          pnpm turbo run build typecheck lint --dry=json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const t=j.tasks??[];const hits=t.filter(x=>x.cache?.status==="HIT").length;console.log(`  ${hits}/${t.length} cacheable tasks would hit the restored cache`)}catch{console.log("  (summary unavailable)")}})'

  migrations-replay:
    name: Migrations replay from empty
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_dev_password
          POSTGRES_DB: ecommerce_replay
        ports: ["5442:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce -d ecommerce_replay"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://ecommerce:ecommerce_dev_password@localhost:5442/ecommerce_replay?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile $PNPM_FLAGS

      # F6/AC3 names `db:reset` specifically, and this job used to run `db:migrate`
      # instead — so the command the criterion is about, the one that drops and replays
      # everything, was never exercised in CI. `db:reset` also carries the loopback
      # guard and the consent env var, so running it here proves that path works
      # unattended, not just on a developer machine.
      #
      # No `if [ -f ... ]` guard any more: apps/api exists, and a conditional that
      # silently passes when the schema is missing is exactly how this job would go
      # quietly vacuous if someone moved it.
      - name: Reset and replay from empty (I7)
        run: pnpm db:reset

      # I8: db:reset already seeds once, so this is the second and third runs. Any
      # non-zero exit means the seed is no longer create-if-missing.
      - name: Seed is idempotent (I8)
        run: |
          pnpm db:seed
          pnpm db:seed

      # The counts F3/AC4 actually promises, asserted rather than trusted: a replay
      # that produced an empty catalogue would otherwise pass this job green.
      - name: Replayed database is genuinely populated
        run: pnpm --filter @repo/api run db:assert-seeded

  harness:
    name: Harness guarantees
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0

      # The merge gate is only as good as these hooks. If they stop blocking, the
      # whole review pipeline becomes decorative — so CI checks them too.
      - name: Hook guarantees hold
        run: node .claude/hooks/__tests__/run-hook-tests.mjs

      - name: No skipped or focused tests on main (I9)
        run: |
          if grep -rnE '\b(describe|it|test)\.(only|skip)\b|\bx(it|describe)\b' \
               --include='*.spec.ts' --include='*.test.ts' --include='*.e2e-spec.ts' \
               --include='*.spec.tsx' --include='*.test.tsx' . ; then
            echo "::error::Skipped or focused tests are not allowed (SPEC.md I9)"
            exit 1
          fi
          echo "no .only / .skip found"
